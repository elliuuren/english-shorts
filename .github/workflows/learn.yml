name: Learn from the results (weekly)

# Once a week: reads how each video did on YouTube and writes learned.json, which the video maker uses
# to pick styles, hooks and topics that work better. It changes no code.

on:
  schedule:
    - cron: "30 3 * * 1"      # every Monday 03:30 UTC (09:30 Bangladesh time)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-shorts       # same line as the daily job: they take turns, so they never clash when saving
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python learn.py
      - name: Save what was learned
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json learned.json stats.json
          git diff --cached --quiet || (git commit -m "learned: $(date -u +%F)" && git pull --rebase && git push)
