name: Daily English Short

on:
  schedule:
    - cron: "17 2,8,14 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Make the video but don't upload it"
        type: boolean
        default: false
      name_test:
        description: "Name test: make ONE audio file that says your name in several spellings (no video)"
        type: boolean
        default: false
      name_variants:
        description: "Name test only: spellings to try, separated by commas (leave empty for the default list)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: english-shorts
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: private
      VOICE_ENGINE: kokoro
      KOKORO_VOICE: am_michael
      VOICE: en-US-AndrewMultilingualNeural
      VOICE_RATE: "+3%"
      SPOKEN_NAME: "Elliooren"
      NAME_VARIANTS: ${{ inputs.name_variants }}
      GREETING: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the Short
        run: python main.py ${{ inputs.name_test && '--name-test' || (inputs.no_upload && '--no-upload' || '') }}

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/short_*.mp4
            output/name_test.mp3
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the video as a Release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls output/short_*.mp4 output/name_test.mp3 2>/dev/null | head -n1)
          if [ -z "$f" ]; then echo "no video to publish"; exit 0; fi
          gh release create "short-$(date -u +%Y%m%d-%H%M%S)" "$f" --title "Short $(date -u +%F)" --notes "Auto-generated Short."
          gh release list --limit 100 --json tagName --jq '.[30:][].tagName' | while read t; do gh release delete "$t" --cleanup-tag --yes; done

      - name: Save topic history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: $(date -u +%F)" && git push)