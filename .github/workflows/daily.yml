name: Daily English Short

on:
  schedule:
    - cron: "30 11 * * *"
  workflow_dispatch:
    inputs:
      no_upload:
        description: "Make the video but don't upload it"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: english-shorts
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: private
      VOICE: en-US-AndrewNeural
      VOICE_RATE: "+6%"
      GREETING: ""
      CTA: "Follow for one tip every day."
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Make the Short
        run: python main.py ${{ inputs.no_upload && '--no-upload' || '' }}

      - name: Keep a copy of the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/short_*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Save topic history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: $(date -u +%F)" && git push)