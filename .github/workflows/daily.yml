name: Daily English Short

on:
  schedule:
    - cron: "17 2,8,14 * * *"   # 3 videos a day: 02:17, 08:17, 14:17 UTC (= 08:17, 14:17, 20:17 Bangladesh time)
  workflow_dispatch:         # lets you press "Run workflow" manually
    inputs:
      no_upload:
        description: "Make the video but don't upload it"
        type: boolean
        default: false

permissions:
  contents: write            # needed to save history.json (so topics don't repeat)

concurrency:
  group: english-shorts
  cancel-in-progress: false

jobs:
  make-short:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: private            # change to "public" once you're happy with the videos
      MOTION_ENGINE: html            # html = animated motion graphics (needs the browser step) | ass = classic look
      VOICE_ENGINE: edge             # edge = the Microsoft voice (exact word timings, no instructions) | gemini | kokoro
      KOKORO_VOICE: am_michael       # male options: am_michael, am_adam, am_fenrir, am_puck, bm_george, bm_lewis
      VOICE: en-US-AndrewMultilingualNeural   # backup voice, used only if Kokoro fails
      VOICE_RATE: "+3%"
      GREETING: ""                   # optional spoken greeting before the hook, e.g. "Hey friends!"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Install the browser that draws the motion graphics
        run: python -m playwright install --with-deps chromium
        continue-on-error: true        # if this fails the video still renders, with the classic look

      - name: Make the Short
        run: python main.py ${{ inputs.no_upload && '--no-upload' || '' }}

      - name: Keep a copy of the video (download it to post on Instagram/TikTok too)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: |
            output/short_*.mp4
          retention-days: 7
          if-no-files-found: ignore

      - name: Publish the video as a Release (easy download)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(ls output/short_*.mp4 2>/dev/null | head -n1)
          if [ -z "$f" ]; then echo "no video to publish"; exit 0; fi
          gh release create "short-$(date -u +%Y%m%d-%H%M%S)" "$f" --title "Short $(date -u +%F)" --notes "Auto-generated Short."
          gh release list --limit 100 --json tagName --jq '.[30:][].tagName' | while read t; do gh release delete "$t" --cleanup-tag --yes; done

      - name: Save topic history
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || (git commit -m "history: $(date -u +%F)" && git push)
