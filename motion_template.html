<!doctype html>
<html><head><meta charset="utf-8">
<style>
/*__FONTFACE__*/
:root{
  --disp:'MG Display','Anton','Impact','Arial Narrow',sans-serif;
  --serif:'MG Serif','Playfair Display','Lora',Georgia,serif;
  --ui:'MG UI','Space Grotesk','Montserrat','Poppins','Inter',sans-serif;
}
html,body{margin:0;padding:0;background:transparent;width:1080px;height:1920px;overflow:hidden}
*{box-sizing:border-box}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;overflow:hidden;color:#fff;font-family:var(--ui)}
</style></head>
<body><div id="stage"></div>
<script>
const D=/*__DATA__*/null;

/* Minimal style: three fixed lanes (title / card / subtitles), flat shapes, short fades and small slides. */
const LANE={titleTop:200,titleH:520,cardTop:820,capTop:1210,maxW:960};
const GOLD=[255,200,60],WHITE=[255,255,255];
const KIND={wrong:{c:'#ff5a5a',label:'NOT THIS'},right:{c:'#3ddc97',label:'SAY THIS'},neutral:{c:'#8fb0ff',label:'REMEMBER'}};

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pg=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3);
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const mx=(a,b,m)=>a+(b-a)*m;
const stage=document.getElementById('stage');
function el(tag,css,parent,txt){const e=document.createElement(tag);if(css)e.style.cssText=css;if(txt!=null)e.textContent=txt;(parent||stage).appendChild(e);return e;}

/* ---------- hook title ---------- */
let hook=null;
if(D.hook&&D.hook.lines&&D.hook.lines.length){
  const box=el('div','position:absolute;left:0;width:1080px;top:'+LANE.titleTop+'px;height:'+LANE.titleH+'px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0');
  hook={box,lines:[],a:D.hook.a,b:D.hook.b};
  D.hook.lines.forEach((w,i)=>{
    const ln=el('div','white-space:nowrap;font-family:var(--disp);letter-spacing:3px;text-shadow:0 6px 28px rgba(0,0,0,.55);color:'+(i===D.hook.gold?'rgb(255,200,60)':'#fff'),box,w);
    hook.lines.push(ln);
  });
  hook.bar=el('div','width:170px;height:9px;border-radius:5px;background:rgb(255,200,60);margin-top:34px;transform-origin:50% 50%',box);
}
function fitHook(){
  if(!hook)return;
  const n=hook.lines.length;
  let fs=Math.min(200,Math.floor((LANE.titleH-90)/(n*1.0)));
  const apply=()=>hook.lines.forEach(l=>{l.style.fontSize=fs+'px';l.style.lineHeight=Math.round(fs*1.02)+'px';});
  apply();
  const w=Math.max(...hook.lines.map(l=>l.scrollWidth));
  if(w>LANE.maxW){fs=Math.floor(fs*LANE.maxW/w);apply();}
}
function tickHook(t){
  if(!hook)return;
  const vis=t>=hook.a&&t<=hook.b+.02,u=t-hook.a;
  hook.box.style.opacity=vis?1-eio(pg(t,hook.b-.3,hook.b)):0;
  if(!vis)return;
  hook.lines.forEach((l,i)=>{const p=eo(pg(u,i*.09,i*.09+.4));l.style.opacity=p;l.style.transform='translateY('+((1-p)*44)+'px)';});
  const b=eo(pg(u,.25,.6));hook.bar.style.transform='scaleX('+b+')';hook.bar.style.opacity=b;
}

/* ---------- key-phrase cards ---------- */
const cards=D.cards.map(c=>{
  const K=KIND[c.kind]||KIND.neutral;
  const box=el('div','position:absolute;left:110px;top:'+LANE.cardTop+'px;width:860px;padding:34px 48px 40px 52px;border-radius:34px;background:rgba(10,12,20,.74);border:2px solid rgba(255,255,255,.14);overflow:hidden;opacity:0');
  el('div','position:absolute;left:0;top:0;bottom:0;width:12px;background:'+K.c,box);
  const lab=el('div','font-size:30px;letter-spacing:8px;font-weight:700;color:'+K.c,box,K.label);
  const row=el('div','position:relative;margin-top:14px;white-space:nowrap',box);
  const ph=el('div','position:relative;display:inline-block;font-weight:700;letter-spacing:-1.5px;color:#fff',row,c.text);
  let strike=null,chk=null;
  if(c.kind==='wrong')strike=el('div','position:absolute;left:-8px;right:-8px;height:10px;border-radius:5px;background:'+K.c+';transform-origin:0 50%;transform:scaleX(0)',ph);
  if(c.kind==='right'){
    chk=el('div','position:absolute;right:0;top:50%;margin-top:-38px;width:76px;height:76px');
    chk.innerHTML='<svg width="76" height="76" viewBox="0 0 76 76"><path d="M16 40L32 56L60 20" fill="none" stroke="'+K.c+'" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"/></svg>';
    row.appendChild(chk);
  }
  return {c,K,box,lab,row,ph,strike,chk};
});
function fitCard(o){
  let fs=112;o.ph.style.fontSize=fs+'px';o.ph.style.lineHeight='1.08';
  const avail=860-100-(o.chk?100:0);
  let w=o.ph.scrollWidth;
  if(w>avail){fs=Math.max(60,Math.floor(fs*avail/w));o.ph.style.fontSize=fs+'px';w=o.ph.scrollWidth;}
  if(w>avail){fs=70;o.ph.style.fontSize=fs+'px';o.ph.style.whiteSpace='normal';o.ph.style.display='block';o.row.style.whiteSpace='normal';if(o.chk)o.chk.style.display='none';}
  if(o.strike)o.strike.style.top=Math.round(o.ph.offsetHeight*.55)+'px';
}
function tickCard(o,t){
  const c=o.c,d0=c.b-c.a,w=d0<1.4?1.4/d0:1,u=(t-c.a)*w,d=d0*w;
  if(u<0||u>d+.02){o.box.style.opacity=0;return;}
  const pin=eo(pg(u,0,.4)),po=eio(pg(u,d-.3,d));
  o.box.style.opacity=pin*(1-po);
  o.box.style.transform='translateY('+((1-pin)*30+po*16)+'px)';
  if(o.strike)o.strike.style.transform='scaleX('+eo(pg(u,.75,1.1))+')';
  if(o.chk)o.chk.querySelector('path').style.strokeDashoffset=1-eo(pg(u,.5,.9));
}

/* ---------- subtitles: serif, the spoken word turns gold ---------- */
const chunks=D.chunks.map(c=>{
  const ln=el('div','position:absolute;left:50%;top:'+LANE.capTop+'px;white-space:nowrap;opacity:0;font-family:var(--serif);font-weight:800;font-size:124px');
  const words=c.words.map(([w,s])=>({e:el('span','display:inline-block;margin:0 16px;padding:4px 0 16px;line-height:1.1;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.7)',ln,w),s}));
  return {a:c.a,b:c.b,ln,words};
});
function fitChunks(){
  chunks.forEach(c=>{
    let fs=124;c.ln.style.fontSize=fs+'px';
    const w=c.ln.offsetWidth;
    if(w>LANE.maxW){fs=Math.max(70,Math.floor(fs*LANE.maxW/w));c.ln.style.fontSize=fs+'px';}
  });
}
function tickChunk(c,t){
  const pi=eo(pg(t,c.a,c.a+.2)),po=eio(pg(t,c.b-.14,c.b)),op=pi*(1-po);
  c.ln.style.opacity=op;
  if(op<.002)return;
  c.ln.style.transform='translateX(-50%) translateY('+((1-pi)*22-po*8)+'px)';
  let k=-1;c.words.forEach((o,i)=>{if(t>=o.s)k=i;});
  c.words.forEach((o,i)=>{
    let a=0;
    if(i===k)a=eo(pg(t,o.s,o.s+.12));
    else if(i===k-1)a=1-eo(pg(t,c.words[k].s,c.words[k].s+.12));
    o.e.style.color='rgb('+[0,1,2].map(j=>Math.round(mx(WHITE[j],GOLD[j],a))).join(',')+')';
  });
}

function render(t){tickHook(t);cards.forEach(o=>tickCard(o,t));chunks.forEach(c=>tickChunk(c,t));}

/* ---------- layout self-check ---------- */
function rectOf(e){const r=e.getBoundingClientRect();return {l:r.left,t:r.top,r:r.right,b:r.bottom};}
function visibleRects(t){
  render(t);const out=[];
  if(hook&&hook.box.style.opacity>.25){const rs=hook.lines.map(rectOf);out.push({k:'title',l:Math.min(...rs.map(r=>r.l)),t:Math.min(...rs.map(r=>r.t)),r:Math.max(...rs.map(r=>r.r)),b:Math.max(...rs.map(r=>r.b))});}
  cards.forEach((o,i)=>{if(o.box.style.opacity>.25)out.push({k:'card'+i,...rectOf(o.box)});});
  chunks.forEach((c,i)=>{if(c.ln.style.opacity>.25)out.push({k:'cap'+i,...rectOf(c.ln)});});
  return out;
}
window.render=render;window.visibleRects=visibleRects;

(async()=>{
  try{
    await Promise.all(["124px 'MG Serif'","200px 'MG Display'","112px 'MG UI'","800 124px 'Playfair Display'","200px 'Anton'","700 112px 'Space Grotesk'"].map(f=>document.fonts.load(f).catch(()=>{})));
    await document.fonts.ready;
  }catch(e){}
  fitHook();cards.forEach(fitCard);fitChunks();
  render(0);
  window.__ready=true;
})().catch(e=>{window.__error=String(e);window.__ready=true;});
</script></body></html>
